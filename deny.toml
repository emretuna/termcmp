# cargo-deny configuration (schema v2, cargo-deny >=0.16).
# Run with: cargo deny check
# Targeted subset:   cargo deny check licenses
#                    cargo deny check bans
#                    cargo deny check advisories
#                    cargo deny check sources

[graph]
# Restrict analysis to the targets we actually ship. Avoids flagging
# platform-specific deps (e.g. windows-sys) that we never link.
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" }, # Linux CI tripwire
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# -----------------------------------------------------------------------------
# Licenses
# -----------------------------------------------------------------------------
[licenses]
# SPDX identifiers only; any dep expression outside this set fails the gate.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    # CC0-1.0 is a public-domain dedication (FSF-free).
    # Required by `notify` (pulled in via pty).
    "CC0-1.0",
    # Permissive data license for the Mozilla CA certificate bundle shipped
    # by `webpki-roots` (pulled in via reqwest -> hyper-rustls).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# Additional private exceptions can be added here per-crate if needed.
exceptions = []

# -----------------------------------------------------------------------------
# Bans / duplicate detection
# -----------------------------------------------------------------------------
[bans]
# Duplicate-version policy: "deny" — any crate resolved at more than one
# version fails the gate unless it carries an explicit `skip` entry below.
# The historical toml_edit / toml_datetime / winnow split is gone: toml_edit
# 0.25 and toml 1.x both resolve winnow 1.x and toml_datetime 1.1, so there is
# no longer a duplicate to absorb there.
multiple-versions = "deny"
wildcards = "deny"
# Workspace-internal path deps (e.g. `pty = { path = "../pty" }`) have
# no version and would otherwise be flagged as wildcards.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Crates we never want to depend on (safety rails).
deny = [
    # Add specific crate+version bans here as findings accumulate.
]

# Duplicates we accept today. Each is an upstream ecosystem migration we
# cannot resolve from this workspace; revisit whenever the laggards catch up.
skip = [
    # proc-macro ecosystem is mid-migration syn v2 -> v3: crossterm (via
    # derive_more) and the ICU/idna stack (via synstructure) still pull v2,
    # while clap_derive / displaydoc already use v3.
    { name = "syn", reason = "proc-macro v2->v3 migration — track crossterm/ICU" },
    # rand 0.8 and 0.9 coexist (proptest on the newer rand_core, ring/older
    # deps on 0.2), dragging two getrandom majors.
    { name = "getrandom", reason = "rand 0.8/0.9 split — track upstream" },
]

# -----------------------------------------------------------------------------
# Advisories (RustSec)
# -----------------------------------------------------------------------------
[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = []

# -----------------------------------------------------------------------------
# Sources
# -----------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
