name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Termcmp? Describe it below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the feature you'd like.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature useful? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you've considered.

  - type: dropdown
    id: shell
    attributes:
      label: Shell (if relevant)
      options:
        - zsh
        - bash
        - fish
        - Other (please specify in description)
    validations:
      required: false

  - type: dropdown
    id: terminal
    attributes:
      label: Terminal (if relevant)
      options:
        - Ghostty
        - Kitty
        - WezTerm
        - Alacritty
        - Rio
        - iTerm2
        - Terminal.app
        - Zed
        - VSCode
        - Other (please specify in description)
    validations:
      required: false
